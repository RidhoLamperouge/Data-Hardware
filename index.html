<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Hardware</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div id="login" hidden>
  <h1>Data Hardware</h1>
  <p>Masuk untuk mengelola data</p>
  <label>Email<input id="em" type="email" autocomplete="username" placeholder="nama@perusahaan.com"></label>
  <label>Kata sandi<input id="pw" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi"></label>
  <div class="err" id="lerr"></div>
  <button class="btn" id="lbtn" style="justify-content:center">Masuk</button>
</div>

<div id="app" hidden>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>
      </div>
      <h1>Data Hardware</h1>
    </div>
    <button class="tab on" data-t="dashboard">Dashboard</button>
    <button class="tab" data-t="rakit">Rakit PC</button>
    <button class="tab" data-t="problem">Problem Hardware</button>
    <div class="user">
      <span id="uemail"></span>
      <button class="btn alt sm" id="reload">Muat ulang</button>
      <button class="btn alt sm" id="out">Keluar</button>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <div class="group grow" data-only="list">
        <input id="q" type="search" placeholder="Cari...">
      </div>
      <div class="group grow" data-only="dashboard">
        <span class="hint">Ringkasan rakitan PC dan problem hardware</span>
      </div>
      <label data-only="dashboard">Periode
        <select id="periode">
          <option value="">Semua waktu</option>
          <option value="ytd">Tahun ini</option>
          <option value="12">12 bulan terakhir</option>
          <option value="6">6 bulan terakhir</option>
          <option value="3">3 bulan terakhir</option>
        </select>
      </label>
      <label>Teknisi
        <select id="ft">
          <option value="">Semua</option>
        </select>
      </label>
      <button class="btn" id="add" data-only="list">+ Tambah data</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<datalist id="tek"></datalist>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/analytics.js"></script>
<script src="js/data.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/rakit.js"></script>
<script src="js/problem.js"></script>
<script src="js/form.js"></script>
<script src="js/app.js"></script>
</body>
</html>
